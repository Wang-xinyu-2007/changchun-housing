name: update-data

on:
  schedule:
    # NBS usually publishes the previous month's 70-city release around the
    # 15th-20th. Check on the 20th and 25th at 10:00 Beijing time.
    - cron: "0 2 20,25 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nbs-housing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fetch latest NBS release
        run: python -m src.update --months 2

      - name: Check whether new data arrived
        id: data
        run: |
          if git diff --quiet -- data/raw; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild report and figures
        if: steps.data.outputs.changed == 'true'
        run: python -m src.pipeline

      - name: Run tests
        if: steps.data.outputs.changed == 'true'
        run: python -m unittest discover -s tests -v

      - name: Commit data and report if changed
        if: steps.data.outputs.changed == 'true'
        run: |
          MONTH=$(python -c "import json; print(json.load(open('data/raw/meta.json'))['latest_month'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports README.md
          git commit -m "data: update NBS housing index (${MONTH})"
          git push
